name: Update news data

on:
  schedule:
    # 20:00 UTC = 05:00 JST, every day
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS and rebuild data/news-live.json
        run: python3 scripts/fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-live.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update news data"
          git push
